name: Stale Issue and PR Management

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          days-before-stale: 60
          days-before-close: 14

          stale-issue-label: 'stale'
          stale-pr-label: 'stale'

          exempt-issue-labels: 'pinned,security,in-progress,needs-decision'
          exempt-pr-labels: 'pinned,security,in-progress,blocked'

          stale-issue-message: >
            This issue has had no activity for 60 days. It will be closed in
            14 days if there's no further activity. If this is still relevant,
            a comment (even just "still relevant") will keep it open — no need
            to write a full update.

          stale-pr-message: >
            This pull request has had no activity for 60 days. It will be
            closed in 14 days if there's no further activity. If you're still
            working on this, a comment or a fresh commit will keep it open.

          close-issue-message: >
            Closing due to inactivity. If this is still relevant, feel free to
            reopen or open a fresh issue referencing this one — closing here
            is about keeping the tracker useful, not a judgment on the report.

          close-pr-message: >
            Closing due to inactivity. Feel free to reopen or open a fresh PR
            when you're ready to continue.

          # Never let this workflow auto-close anything security-related.
          exempt-all-milestones: true
