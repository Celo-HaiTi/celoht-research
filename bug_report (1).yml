name: 🐛 Bug Report
description: Report something that isn't working as expected
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please check [existing issues](https://github.com/Celo-HT/CeloHT/issues) first to avoid duplicates.

  - type: input
    id: repository
    attributes:
      label: Repository
      description: Which repository is this bug in?
      placeholder: "e.g. CeloHT, celoht-research, Brand"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low (cosmetic, minor)
        - Medium (functional issue, workaround exists)
        - High (blocks a core function)
        - Critical (security or data-safety concern — please use security@celoht.com instead)
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, device — whatever's relevant.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true
        - label: This is not a security vulnerability (if it is, I'll email security@celoht.com instead)
          required: true
