name: Welcome First-Time Contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Greet first-time contributors
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Welcome to CeloHT, and thank you for opening your first issue!

            A few quick pointers:
            - Please review our [Code of Conduct](https://github.com/Celo-HT/.github/blob/main/CODE_OF_CONDUCT.md)
            - Check out [CONTRIBUTING.md](https://github.com/Celo-HT/.github/blob/main/CONTRIBUTING.md) if you'd like to help resolve this yourself
            - A maintainer will triage this soon — response times are noted in [SUPPORT.md](https://github.com/Celo-HT/.github/blob/main/SUPPORT.md)

            We're glad you're here. 🌱
          pr-message: |
            👋 Welcome to CeloHT, and thank you for your first pull request!

            A few quick pointers:
            - Please review our [Code of Conduct](https://github.com/Celo-HT/.github/blob/main/CODE_OF_CONDUCT.md) and [CONTRIBUTING.md](https://github.com/Celo-HT/.github/blob/main/CONTRIBUTING.md)
            - A maintainer will review this soon — see [MAINTAINERS.md](https://github.com/Celo-HT/.github/blob/main/MAINTAINERS.md) for how review assignment works
            - Don't worry if you get review comments — that's a normal, expected part of the process, not a sign something went wrong

            Thanks for contributing to financial inclusion, education, and reforestation. 🌱
