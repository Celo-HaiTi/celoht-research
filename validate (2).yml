name: Validate Brand Repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for broken internal links in Markdown
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/mlc_config.json'

      - name: Lint Markdown formatting
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: '**/*.md'

      - name: Validate SVG files are well-formed XML
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          find logos -name "*.svg" -print0 | xargs -0 -I{} xmllint --noout "{}"
          echo "All SVG files are valid XML."
